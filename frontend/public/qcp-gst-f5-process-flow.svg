<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2600" viewBox="0 0 560 2600">
  <defs>
    <style>
      .title{font:700 16px Arial,sans-serif;fill:#111827}
      .lane{font:600 13px Arial,sans-serif;fill:#1f2937}
      .node{font:500 11px Arial,sans-serif;fill:#1f2937}
      .small{font:500 10px Arial,sans-serif;fill:#1f2937}
      .box{stroke:#94a3b8;stroke-width:1.2;rx:18;fill:#fff}
      .arrow{stroke:#64748b;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
      .decision{fill:#fff7ed;stroke:#f6ad55;stroke-width:1.1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="560" height="2600" fill="#fff5e5"/>
  <text x="280" y="28" text-anchor="middle" class="title">QCP AI Agent for End-to-End GST F5 Filing Automation</text>
  <text x="280" y="46" text-anchor="middle" class="title" font-size="13">Swimlane Process Flow</text>
  <circle cx="280" cy="68" r="10" fill="#f69d39" stroke="#8a4b12"/>

  <!-- Human Accountant -->
  <rect x="170" y="90" width="220" height="215" fill="#dcebfb" stroke="#9fc3e8"/>
  <text x="176" y="108" class="lane">Human Accountant</text>
  <rect x="185" y="128" width="190" height="32" class="box"/><text x="280" y="148" text-anchor="middle" class="node">Start quarterly GST F5 workflow</text>
  <path d="M280 160 V178" class="arrow"/>
  <rect x="205" y="178" width="150" height="32" class="box"/><text x="280" y="198" text-anchor="middle" class="node">Select reporting quarter</text>
  <path d="M280 210 V228" class="arrow"/>
  <rect x="190" y="228" width="180" height="32" class="box"/><text x="280" y="248" text-anchor="middle" class="node">Confirm GST registration status</text>
  <path d="M280 260 V278" class="arrow"/>
  <rect x="190" y="278" width="180" height="32" class="box"/><text x="280" y="298" text-anchor="middle" class="node">Choose active data sources</text>
  <path d="M280 305 V335" class="arrow"/>

  <!-- System Init -->
  <rect x="170" y="335" width="220" height="150" fill="#f1f5f9" stroke="#b8c3d8"/>
  <text x="176" y="353" class="lane">System / Workflow Engine</text>
  <rect x="205" y="375" width="150" height="32" class="box"/><text x="280" y="395" text-anchor="middle" class="node">Create ingestion batch ID</text>
  <path d="M280 407 V425" class="arrow"/>
  <rect x="205" y="425" width="150" height="32" class="box"/><text x="280" y="445" text-anchor="middle" class="node">Initialize workflow state</text>
  <path d="M280 457 V475" class="arrow"/>
  <rect x="190" y="475" width="180" height="32" class="box"/><text x="280" y="495" text-anchor="middle" class="node">Set filing readiness = Not Ready</text>
  <path d="M280 485 V530" class="arrow"/>

  <!-- Audit Trail -->
  <rect x="160" y="525" width="240" height="70" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="166" y="543" class="lane">Audit Trail</text>
  <rect x="175" y="560" width="210" height="28" class="box"/><text x="280" y="578" text-anchor="middle" class="node">Log workflow start and source selection</text>
  <path d="M280 595 V625" class="arrow"/>

  <!-- Data Ingestion Hub -->
  <rect x="55" y="625" width="450" height="760" fill="#e3f8e8" stroke="#9bc9a2"/>
  <text x="62" y="643" class="lane">Data Ingestion Hub</text>
  <polygon points="280,670 330,695 280,720 230,695" class="decision"/><text x="280" y="698" text-anchor="middle" class="small">&lt;CSV / Excel selected?&gt;</text>
  <text x="297" y="717" class="small">Yes</text>
  <path d="M280 720 V745" class="arrow"/>
  <rect x="235" y="745" width="90" height="28" class="box"/><text x="280" y="763" text-anchor="middle" class="node">Upload file</text>
  <path d="M280 773 V815" class="arrow"/>
  <rect x="190" y="815" width="180" height="32" class="box"/><text x="280" y="835" text-anchor="middle" class="node">Map columns to GST schema</text>
  <path d="M280 847 V890" class="arrow"/>
  <polygon points="280,890 340,915 280,940 220,915" class="decision"/><text x="280" y="918" text-anchor="middle" class="small">&lt;Sample dataset selected?&gt;</text>
  <text x="297" y="937" class="small">Yes</text>
  <path d="M280 940 V965" class="arrow"/>
  <rect x="205" y="965" width="150" height="30" class="box"/><text x="280" y="984" text-anchor="middle" class="node">Load sample quarterly data</text>
  <path d="M280 995 V1040" class="arrow"/>
  <polygon points="280,1040 350,1065 280,1090 210,1065" class="decision"/><text x="280" y="1068" text-anchor="middle" class="small">&lt;Database connector selected?&gt;</text>
  <text x="297" y="1087" class="small">Yes</text>
  <path d="M280 1090 V1115" class="arrow"/>
  <rect x="230" y="1115" width="100" height="28" class="box"/><text x="280" y="1133" text-anchor="middle" class="node">Test connection</text>
  <path d="M280 1143 V1170" class="arrow"/>
  <polygon points="280,1170 345,1195 280,1220 215,1195" class="decision"/><text x="280" y="1198" text-anchor="middle" class="small">&lt;Connection successful?&gt;</text>
  <text x="220" y="1210" class="small">Yes</text><text x="342" y="1210" class="small">No</text>
  <path d="M250 1215 V1245 H170 V1280" class="arrow"/>
  <rect x="90" y="1280" width="170" height="30" class="box"/><text x="175" y="1299" text-anchor="middle" class="node">Preview and import records</text>
  <path d="M310 1215 V1245 H390 V1280" class="arrow"/>
  <rect x="315" y="1280" width="150" height="30" class="box"/><text x="390" y="1299" text-anchor="middle" class="node">Show connection error</text>
  <path d="M280 1220 V1335" class="arrow"/>
  <polygon points="280,1335 350,1360 280,1385 210,1360" class="decision"/><text x="280" y="1363" text-anchor="middle" class="small">&lt;Accounting API selected?&gt;</text>
  <text x="297" y="1382" class="small">Yes</text>
  <path d="M280 1385 V1410" class="arrow"/>
  <rect x="235" y="1410" width="90" height="28" class="box"/><text x="280" y="1428" text-anchor="middle" class="node">Connect API</text>
  <path d="M280 1438 V1465" class="arrow"/>
  <polygon points="280,1465 340,1490 280,1515 220,1490" class="decision"/><text x="280" y="1493" text-anchor="middle" class="small">&lt;API connected?&gt;</text>
  <text x="220" y="1505" class="small">Yes</text><text x="342" y="1505" class="small">No</text>
  <path d="M250 1510 V1535 H170 V1570" class="arrow"/>
  <rect x="85" y="1570" width="185" height="30" class="box"/><text x="177" y="1589" text-anchor="middle" class="node">Sync invoices, receipts, expenses</text>
  <path d="M310 1510 V1535 H390 V1570" class="arrow"/>
  <rect x="330" y="1570" width="120" height="30" class="box"/><text x="390" y="1589" text-anchor="middle" class="node">Show API issue</text>
  <path d="M280 1600 V1630" class="arrow"/>

  <!-- Evidence -->
  <rect x="40" y="1640" width="480" height="245" fill="#ddf7f4" stroke="#8fd1c7"/>
  <text x="48" y="1658" class="lane">Evidence Layer</text>
  <polygon points="280,1685 360,1710 280,1735 200,1710" class="decision"/><text x="280" y="1713" text-anchor="middle" class="small">&lt;Supporting evidence uploaded?&gt;</text>
  <path d="M240 1730 V1760 H145 V1795" class="arrow"/><text x="214" y="1748" class="small">Yes</text>
  <rect x="60" y="1795" width="170" height="42" class="box"/><text x="145" y="1812" text-anchor="middle" class="node">Upload invoices, receipts, permits,</text><text x="145" y="1826" text-anchor="middle" class="node">export evidence, credit notes</text>
  <path d="M145 1837 V1870" class="arrow"/>
  <rect x="90" y="1870" width="130" height="30" class="box"/><text x="155" y="1889" text-anchor="middle" class="node">Extract metadata</text>
  <path d="M155 1900 V1930" class="arrow"/>
  <rect x="85" y="1930" width="145" height="30" class="box"/><text x="158" y="1949" text-anchor="middle" class="node">Link evidence to transactions</text>
  <path d="M320 1730 V1760 H415 V1795" class="arrow"/><text x="342" y="1748" class="small">No</text>
  <rect x="325" y="1795" width="170" height="42" class="box"/><text x="410" y="1812" text-anchor="middle" class="node">Mark evidence as missing</text><text x="410" y="1826" text-anchor="middle" class="node">or unlinked</text>
  <path d="M280 1885 V1970" class="arrow"/>

  <rect x="160" y="1985" width="240" height="70" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="166" y="2003" class="lane">Audit Trail</text>
  <rect x="175" y="2020" width="210" height="28" class="box"/><text x="280" y="2038" text-anchor="middle" class="node">Log ingestion and evidence actions</text>
  <path d="M280 2055 V2085" class="arrow"/>

  <!-- Gating and validation condensed -->
  <rect x="45" y="2085" width="470" height="305" fill="#f1f5f9" stroke="#b8c3d8"/>
  <text x="52" y="2103" class="lane">System / Workflow Engine</text>
  <polygon points="280,2130 375,2155 280,2180 185,2155" class="decision"/><text x="280" y="2158" text-anchor="middle" class="small">&lt;At least one transaction source loaded?&gt;</text>
  <path d="M250 2175 V2205 H165 V2235" class="arrow"/><text x="218" y="2198" class="small">No</text>
  <rect x="95" y="2235" width="140" height="30" class="box"/><text x="165" y="2254" text-anchor="middle" class="node">Show transaction data required</text>
  <path d="M310 2175 V2205 H395 V2255" class="arrow"/><text x="334" y="2198" class="small">Yes</text>
  <polygon points="280,2280 365,2305 280,2330 195,2305" class="decision"/><text x="280" y="2308" text-anchor="middle" class="small">&lt;Quarter and GST status confirmed?&gt;</text>
  <path d="M250 2325 V2350 H165 V2375" class="arrow"/><text x="222" y="2343" class="small">No</text>
  <rect x="95" y="2375" width="140" height="30" class="box"/><text x="165" y="2394" text-anchor="middle" class="node">Request missing confirmation</text>
  <path d="M310 2325 V2355 H395 V2410" class="arrow"/><text x="334" y="2343" class="small">Yes</text>
  <rect x="180" y="2418" width="200" height="30" class="box"/><text x="280" y="2437" text-anchor="middle" class="node">Consolidate active source records</text>
  <path d="M280 2448 V2475" class="arrow"/>
  <rect x="150" y="2475" width="260" height="30" class="box"/><text x="280" y="2494" text-anchor="middle" class="node">Standardize records into canonical GST schema</text>
  <path d="M280 2505 V2532" class="arrow"/>
  <rect x="120" y="2532" width="320" height="42" class="box"/><text x="280" y="2548" text-anchor="middle" class="node">Validate fields, dates, currency, amounts,</text><text x="280" y="2562" text-anchor="middle" class="node">duplicates, and source records</text>
</svg>
